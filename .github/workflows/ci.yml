name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codek_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codek_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codek_hub?schema=public

      - name: Apply all migrations to a clean PostgreSQL database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codek_hub?schema=public

      - name: Syntax check
        run: find apps packages tests scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

      - name: Check database integrity
        run: node scripts/databaseCheck.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codek_hub?schema=public
