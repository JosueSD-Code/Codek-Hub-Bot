name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Syntax check
        run: find apps packages tests scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

      - name: Check database integrity
        if: ${{ github.event_name == 'push' && secrets.DATABASE_URL != '' }}
        continue-on-error: true
        run: node scripts/databaseCheck.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
